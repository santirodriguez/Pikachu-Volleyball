name: Phase 2 Electron Candidate

on:
  pull_request:
    branches:
      - v3-restart
    paths:
      - '.github/workflows/phase2-electron-candidate.yml'
      - 'desktop/**'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack*.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-electron-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PV_ELECTRON_VERSION: '44.4.1'
  PV_ELECTRON_BUILDER_VERSION: '26.15.7'
  PV_BASELINE_APPIMAGE_BYTES: '97094772'

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install frozen baseline dependencies
        run: npm ci

      - name: Validate frozen baseline toolchain
        shell: bash
        run: |
          set -euo pipefail
          electron_version="$(node -p "require('electron/package.json').version")"
          builder_version="$(node -p "require('electron-builder/package.json').version")"
          app_builder_lib_version="$(node -p "require('app-builder-lib/package.json').version")"

          [[ "$electron_version" == '35.7.5' ]] || {
            echo "Expected frozen Electron 35.7.5, found $electron_version" >&2
            exit 1
          }
          [[ "$builder_version" == "$PV_ELECTRON_BUILDER_VERSION" ]] || {
            echo "Expected electron-builder $PV_ELECTRON_BUILDER_VERSION, found $builder_version" >&2
            exit 1
          }
          [[ "$app_builder_lib_version" == "$PV_ELECTRON_BUILDER_VERSION" ]] || {
            echo "Expected app-builder-lib $PV_ELECTRON_BUILDER_VERSION, found $app_builder_lib_version" >&2
            exit 1
          }

      - name: Run baseline quality checks
        run: npm run quality:check

      - name: Freeze baseline web output
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/pv-phase2-dist.sha256"
          test -s "$RUNNER_TEMP/pv-phase2-dist.sha256"
          echo "Frozen $(wc -l < "$RUNNER_TEMP/pv-phase2-dist.sha256") web output files before Electron overlay."

      - name: Overlay supported Electron candidate without changing package metadata
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --no-audit --no-fund "electron@$PV_ELECTRON_VERSION"

          electron_version="$(node -p "require('electron/package.json').version")"
          builder_version="$(node -p "require('electron-builder/package.json').version")"
          app_builder_lib_version="$(node -p "require('app-builder-lib/package.json').version")"

          [[ "$electron_version" == "$PV_ELECTRON_VERSION" ]] || {
            echo "Expected candidate Electron $PV_ELECTRON_VERSION, found $electron_version" >&2
            exit 1
          }
          [[ "$builder_version" == "$PV_ELECTRON_BUILDER_VERSION" ]] || {
            echo "electron-builder changed unexpectedly: $builder_version" >&2
            exit 1
          }
          [[ "$app_builder_lib_version" == "$PV_ELECTRON_BUILDER_VERSION" ]] || {
            echo "app-builder-lib changed unexpectedly: $app_builder_lib_version" >&2
            exit 1
          }

          git diff --exit-code -- package.json package-lock.json
          sha256sum -c "$RUNNER_TEMP/pv-phase2-dist.sha256"

          {
            echo "## Phase 2 candidate toolchain"
            echo ""
            echo "- Electron: \`$electron_version\`"
            echo "- electron-builder: \`$builder_version\`"
            echo "- app-builder-lib: \`$app_builder_lib_version\`"
            echo "- Package metadata modified: \`no\`"
            echo "- Baseline web output modified by overlay: \`no\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build candidate AppImage with existing packaging policy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          sha256sum -c "$RUNNER_TEMP/pv-phase2-dist.sha256"
          node scripts/patch-appimage-launcher.cjs
          npx --no-install electron-builder \
            --linux AppImage \
            --publish=never \
            --config.electronVersion="$PV_ELECTRON_VERSION"
          sha256sum -c "$RUNNER_TEMP/pv-phase2-dist.sha256"

      - name: Inspect candidate package and AppImage policy
        shell: bash
        run: |
          set -euo pipefail
          evidence="$PWD/release/phase2-evidence"
          mkdir -p "$evidence"

          mapfile -t appimages < <(find release -maxdepth 1 -type f -name '*.AppImage' | sort)
          [[ "${#appimages[@]}" -eq 1 ]] || {
            echo "Expected exactly one AppImage, found ${#appimages[@]}" >&2
            exit 1
          }
          candidate="${appimages[0]}"
          chmod 0755 "$candidate"

          bytes="$(stat -c%s "$candidate")"
          mib="$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')"
          delta_bytes=$((bytes - PV_BASELINE_APPIMAGE_BYTES))
          delta_percent="$(awk -v d="$delta_bytes" -v b="$PV_BASELINE_APPIMAGE_BYTES" 'BEGIN { printf "%+.2f", (d / b) * 100 }')"
          sha="$(sha256sum "$candidate" | awk '{print $1}')"
          printf '%s  %s\n' "$sha" "$(basename "$candidate")" > release/SHA256SUMS.txt

          app_dir=release/linux-unpacked
          asar_path="$app_dir/resources/app.asar"
          test -f "$asar_path"
          mapfile -t locale_paks < <(find "$app_dir/locales" -maxdepth 1 -type f -name '*.pak' | sort)
          [[ "${#locale_paks[@]}" -eq 1 && "$(basename "${locale_paks[0]}")" == 'en-US.pak' ]] || {
            echo 'Candidate must package exactly en-US.pak.' >&2
            printf '%s\n' "${locale_paks[@]}" >&2
            exit 1
          }

          npx --no-install asar list "$asar_path" > "$evidence/app-asar-list.txt"
          if grep -Eq '^/node_modules/' "$evidence/app-asar-list.txt"; then
            echo 'Candidate app.asar unexpectedly contains node_modules.' >&2
            exit 1
          fi
          if grep -Eq '\.map$' "$evidence/app-asar-list.txt"; then
            echo 'Candidate app.asar unexpectedly contains source maps.' >&2
            exit 1
          fi

          offset="$($candidate --appimage-offset)"
          compression_id="$(node -e "const fs=require('fs');const p=process.argv[1];const o=Number(process.argv[2]);const b=Buffer.alloc(32);const f=fs.openSync(p,'r');fs.readSync(f,b,0,b.length,o);fs.closeSync(f);if(b.toString('ascii',0,4)!=='hsqs')process.exit(2);process.stdout.write(String(b.readUInt16LE(20)));" "$candidate" "$offset")"
          block_size="$(node -e "const fs=require('fs');const p=process.argv[1];const o=Number(process.argv[2]);const b=Buffer.alloc(32);const f=fs.openSync(p,'r');fs.readSync(f,b,0,b.length,o);fs.closeSync(f);process.stdout.write(String(b.readUInt32LE(12)));" "$candidate" "$offset")"
          [[ "$compression_id" == '6' ]] || {
            echo "Expected existing Zstd SquashFS policy, compression id was $compression_id" >&2
            exit 1
          }
          [[ "$block_size" == '131072' ]] || {
            echo "Expected existing 131072-byte SquashFS block size, found $block_size" >&2
            exit 1
          }

          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          (cd "$extract_dir" && "$GITHUB_WORKSPACE/$candidate" --appimage-extract >/dev/null)
          root="$extract_dir/squashfs-root"
          apprun="$root/AppRun"
          bash -n "$apprun"
          grep -Fq 'ERROR: sandbox-disabling Chromium switch is disabled by this AppImage security policy:' "$apprun"
          grep -Fq 'ERROR: Chromium sandbox prerequisites are unavailable; refusing to launch unsandboxed.' "$apprun"
          ! grep -Fq 'NO_SANDBOX=(--no-sandbox)' "$apprun"
          ! grep -Fq 'NO_SANDBOX[@]' "$apprun"

          for argument in --no-sandbox --disable-gpu-sandbox; do
            set +e
            output="$("$apprun" "$argument" 2>&1)"
            status=$?
            set -e
            [[ "$status" -eq 1 ]] || {
              echo "AppRun $argument returned $status instead of 1" >&2
              exit 1
            }
            [[ "$output" == "ERROR: sandbox-disabling Chromium switch is disabled by this AppImage security policy: $argument" ]] || {
              echo "Unexpected rejection output for $argument: $output" >&2
              exit 1
            }
          done

          find "$root" -printf '%P\t%y\t%s\n' | sort > "$evidence/appimage-inventory.tsv"
          if grep -Eiq 'webkit|gstreamer|libgst' "$evidence/appimage-inventory.tsv"; then
            echo 'Candidate unexpectedly packages WebKitGTK/GStreamer content.' >&2
            grep -Ei 'webkit|gstreamer|libgst' "$evidence/appimage-inventory.tsv" >&2 || true
            exit 1
          fi

          executable="$(find "$root" -maxdepth 1 -type f -name 'pikachu-volleyball' -print -quit || true)"
          if [[ -n "$executable" ]]; then
            LD_LIBRARY_PATH="$root/usr/lib" ldd "$executable" > "$evidence/electron-ldd.txt" 2>&1 || true
          else
            echo 'Packaged Electron executable not found for ldd evidence.' > "$evidence/electron-ldd.txt"
          fi

          printf 'electron=%s\nelectron_builder=%s\nbytes=%s\nmib=%s\nsha256=%s\nbaseline_bytes=%s\ndelta_bytes=%s\ndelta_percent=%s\ncompression=zstd\nblock_size=%s\n' \
            "$PV_ELECTRON_VERSION" "$PV_ELECTRON_BUILDER_VERSION" "$bytes" "$mib" "$sha" \
            "$PV_BASELINE_APPIMAGE_BYTES" "$delta_bytes" "$delta_percent" "$block_size" \
            > "$evidence/summary.txt"

          {
            echo "## Phase 2 AppImage evidence"
            echo ""
            echo "- Size: \`$bytes\` bytes (\`$mib MiB\`)"
            echo "- Frozen 2.1 AppImage: \`$PV_BASELINE_APPIMAGE_BYTES\` bytes"
            echo "- Size delta: \`$delta_bytes\` bytes (\`$delta_percent%\`)"
            echo "- SHA-256: \`$sha\`"
            echo "- SquashFS: \`zstd\`, \`$block_size\` byte blocks"
            echo "- Electron locale packs: \`${#locale_paks[@]}\` (en-US only)"
            echo "- AppRun sandbox policy: \`fail-closed\`"
            echo "- WebKitGTK/GStreamer packaged: \`no\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report build sizes
        run: node scripts/report-build-metrics.cjs release/build-metrics.json

      - name: Measure unpacked packaged startup
        shell: bash
        run: |
          set -euo pipefail
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          xvfb-run -a node scripts/measure-startup.cjs release/startup-metrics.json
          cat release/startup-metrics.json

      - name: Upload Phase 2 candidate
        uses: actions/upload-artifact@v6
        with:
          name: phase2-electron-candidate
          path: |
            release/*.AppImage
            release/SHA256SUMS.txt
            release/build-metrics.json
            release/startup-metrics.json
            release/phase2-evidence/**
          if-no-files-found: error
          retention-days: 14

  runtime-matrix:
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: debian-12
            family: debian
            image: debian:bookworm-20260824-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
          - label: ubuntu-22.04
            family: debian
            image: ubuntu:jammy-20260810@sha256:79676deb51ebb02885b0b9d33788e78a37cf1045ad79d1bb04c6a222c3556b3d
          - label: ubuntu-24.04
            family: debian
            image: ubuntu:noble-20260810@sha256:1e0a86e57d247923571b75e0aaf48a1449cf8c543d51fb3e07a4a7d7bfa79316
          - label: fedora-44
            family: fedora
            image: fedora:44@sha256:be9d65e2344d805cc11114319c685ecaa96b6d9b4350a0a6460cdb931babbd19
          - label: opensuse-leap-16.0
            family: opensuse
            image: opensuse/leap:16.0@sha256:77732aa024f765ecdb4067affdea9e386d68056d0d281608ce4665d8fb0b4edd

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download candidate
        uses: actions/download-artifact@v5
        with:
          name: phase2-electron-candidate
          path: phase2-candidate

      - name: Validate candidate runtime contract
        shell: bash
        env:
          PV_MATRIX_IMAGE: ${{ matrix.image }}
          PV_MATRIX_FAMILY: ${{ matrix.family }}
          PV_MATRIX_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          result="$PWD/phase2-runtime-$PV_MATRIX_LABEL"
          rm -rf "$result"
          mkdir -p "$result"

          docker run --rm --platform linux/amd64 --shm-size=1g --security-opt seccomp=unconfined \
            -e PV_MATRIX_FAMILY="$PV_MATRIX_FAMILY" \
            -e PV_MATRIX_LABEL="$PV_MATRIX_LABEL" \
            -v "$PWD:/workspace" -w /workspace \
            "$PV_MATRIX_IMAGE" bash -lc '
              set -euo pipefail

              case "$PV_MATRIX_FAMILY" in
                debian)
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update
                  alsa_pkg=libasound2
                  cups_pkg=libcups2
                  gtk_pkg=libgtk-3-0
                  atspi_pkg=libatspi2.0-0
                  atkbridge_pkg=libatk-bridge2.0-0
                  apt-cache show libasound2t64 >/dev/null 2>&1 && alsa_pkg=libasound2t64 || true
                  apt-cache show libcups2t64 >/dev/null 2>&1 && cups_pkg=libcups2t64 || true
                  apt-cache show libgtk-3-0t64 >/dev/null 2>&1 && gtk_pkg=libgtk-3-0t64 || true
                  apt-cache show libatspi2.0-0t64 >/dev/null 2>&1 && atspi_pkg=libatspi2.0-0t64 || true
                  apt-cache show libatk-bridge2.0-0t64 >/dev/null 2>&1 && atkbridge_pkg=libatk-bridge2.0-0t64 || true
                  apt-get install -y --no-install-recommends \
                    ca-certificates dbus-x11 passwd procps util-linux xauth xvfb \
                    "$gtk_pkg" libnss3 "$alsa_pkg" libxss1 libgbm1 libdrm2 libxkbcommon0 \
                    "$atkbridge_pkg" "$atspi_pkg" "$cups_pkg" libxcomposite1 libxdamage1 libxfixes3 \
                    libxrandr2 libpango-1.0-0 libcairo2
                  dpkg-query -W -f="\${Package}\t\${Version}\n" | sort > "/workspace/phase2-runtime-$PV_MATRIX_LABEL/installed-packages.txt"
                  ;;
                fedora)
                  dnf -y install \
                    ca-certificates dbus-x11 procps-ng shadow-utils util-linux xauth xorg-x11-server-Xvfb \
                    gtk3 nss alsa-lib libXScrnSaver mesa-libgbm libdrm libxkbcommon at-spi2-core cups-libs \
                    libXcomposite libXdamage libXfixes libXrandr pango cairo
                  rpm -qa --qf "%{NAME}\t%{VERSION}-%{RELEASE}\n" | sort > "/workspace/phase2-runtime-$PV_MATRIX_LABEL/installed-packages.txt"
                  ;;
                opensuse)
                  zypper --non-interactive refresh
                  zypper --non-interactive install --no-recommends \
                    ca-certificates dbus-1 procps shadow util-linux xauth xorg-x11-server-Xvfb \
                    gtk3 mozilla-nss libasound2 libXss1 libgbm1 libdrm2 libxkbcommon0 at-spi2-core libcups2 \
                    libXcomposite1 libXdamage1 libXfixes3 libXrandr2 pango libcairo2
                  rpm -qa --qf "%{NAME}\t%{VERSION}-%{RELEASE}\n" | sort > "/workspace/phase2-runtime-$PV_MATRIX_LABEL/installed-packages.txt"
                  ;;
                *)
                  echo "Unknown matrix family: $PV_MATRIX_FAMILY" >&2
                  exit 2
                  ;;
              esac

              if unshare -Ur true >/dev/null 2>&1; then
                echo "user_namespaces=available" > "/workspace/phase2-runtime-$PV_MATRIX_LABEL/host-capabilities.txt"
              else
                echo "user_namespaces=unavailable" > "/workspace/phase2-runtime-$PV_MATRIX_LABEL/host-capabilities.txt"
              fi

              candidate="$(find /workspace/phase2-candidate -maxdepth 1 -type f -name "*.AppImage" -print -quit)"
              test -s "$candidate"
              chmod 0755 "$candidate"

              stage="/tmp/pv-phase2-$PV_MATRIX_LABEL"
              rm -rf "$stage"
              mkdir -p "$stage"
              cp "$candidate" "$stage/candidate.AppImage"
              cd "$stage"
              ./candidate.AppImage --appimage-extract >/dev/null
              root="$stage/squashfs-root"
              executable="$root/pikachu-volleyball"
              test -x "$executable"

              chown root:root "$root/chrome-sandbox"
              chmod 4755 "$root/chrome-sandbox"
              useradd -m pvsmoke 2>/dev/null || true
              mkdir -p "$stage/results" "$stage/user-data"
              chown -R pvsmoke:pvsmoke "$stage/results" "$stage/user-data"

              LD_LIBRARY_PATH="$root/usr/lib" ldd "$executable" > "$stage/results/ldd.txt"
              if grep -Fq "not found" "$stage/results/ldd.txt"; then
                echo "Missing runtime library on $PV_MATRIX_LABEL" >&2
                cat "$stage/results/ldd.txt" >&2
                exit 1
              fi

              Xvfb :99 -screen 0 1024x768x24 >"$stage/results/xvfb.log" 2>&1 &
              xvfb_pid=$!
              trap "kill $xvfb_pid >/dev/null 2>&1 || true" EXIT
              sleep 1

              runuser -u pvsmoke -- dbus-run-session -- env \
                DISPLAY=:99 \
                LD_LIBRARY_PATH="$root/usr/lib" \
                PV_STARTUP_METRICS_FILE="$stage/results/startup-metrics.json" \
                PV_STARTUP_USER_DATA_DIR="$stage/user-data" \
                "$executable" --enable-sandbox

              test -s "$stage/results/startup-metrics.json"
              cp -a "$stage/results/." "/workspace/phase2-runtime-$PV_MATRIX_LABEL/"
              chown -R "$(stat -c %u /workspace):$(stat -c %g /workspace)" "/workspace/phase2-runtime-$PV_MATRIX_LABEL" || true
            '

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase2-runtime-${{ matrix.label }}
          path: phase2-runtime-${{ matrix.label }}/
          if-no-files-found: warn
          retention-days: 14

  hosted-direct-appimage:
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download candidate
        uses: actions/download-artifact@v5
        with:
          name: phase2-electron-candidate
          path: phase2-candidate

      - name: Probe direct AppImage execution without turning host limits into product failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase2-direct
          candidate="$(find phase2-candidate -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -s "$candidate"
          chmod 0755 "$candidate"

          if ! unshare -Ur true >/dev/null 2>&1; then
            echo 'status=skipped' > phase2-direct/result.txt
            echo 'reason=hosted runner does not provide the unprivileged user namespace capability required by the fail-closed AppRun policy' >> phase2-direct/result.txt
            echo 'Direct AppImage smoke skipped because the hosted runner lacks the required user-namespace capability.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sudo apt-get update
          fuse_pkg=libfuse2
          apt-cache show libfuse2t64 >/dev/null 2>&1 && fuse_pkg=libfuse2t64 || true
          sudo apt-get install -y --no-install-recommends "$fuse_pkg" xvfb

          metrics="$PWD/phase2-direct/startup-metrics.json"
          user_data="$PWD/phase2-direct/user-data"
          mkdir -p "$user_data"
          xvfb-run -a env \
            PV_STARTUP_METRICS_FILE="$metrics" \
            PV_STARTUP_USER_DATA_DIR="$user_data" \
            "$candidate"
          test -s "$metrics"
          echo 'status=pass' > phase2-direct/result.txt

      - name: Upload direct execution evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase2-direct-appimage
          path: phase2-direct/
          if-no-files-found: warn
          retention-days: 14
