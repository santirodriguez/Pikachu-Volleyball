name: Sync release lockfile metadata

on:
  push:
    branches:
      - v2.1-release-prep

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: v2.1-release-prep

      - name: Synchronize lockfile version only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lines = fs.readFileSync(path, 'utf8').split('\n');
          let replacements = 0;

          for (let i = 0; i < Math.min(lines.length, 20); i += 1) {
            if (lines[i].includes('"version": "2.0.0"')) {
              lines[i] = lines[i].replace('"version": "2.0.0"', '"version": "2.1.0"');
              replacements += 1;
            }
          }

          if (replacements !== 2) {
            throw new Error(`Expected exactly two root version replacements, found ${replacements}`);
          }

          fs.writeFileSync(path, lines.join('\n'));
          NODE

          git diff --check -- package-lock.json
          changed_lines="$(git diff --numstat -- package-lock.json | awk '{ print $1 + $2 }')"
          if [[ "$changed_lines" != "4" ]]; then
            echo "Expected exactly two one-line replacements in package-lock.json" >&2
            git diff -- package-lock.json >&2
            exit 1
          fi

      - name: Commit synchronized lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-prep-lock-sync.yml
          git add package-lock.json
          git commit -m "Synchronize 2.1.0 lockfile metadata"
          git push origin HEAD:v2.1-release-prep
