name: Temporary Checkpoint 1 Fail-Closed Validation

on:
  pull_request:
    branches:
      - v2.1

permissions:
  contents: read

jobs:
  appimage-validation:
    if: github.head_ref == 'v2.1-appimage-footprint' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'santirodriguez'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify packaging toolchain
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./node_modules/electron-builder/package.json'); if (p.version !== '26.15.7') process.exit(1); console.log('electron-builder', p.version)"
          node -e "const p=require('./node_modules/app-builder-lib/package.json'); if (p.version !== '26.15.7') process.exit(1); console.log('app-builder-lib', p.version)"
          node -e "const p=require('./node_modules/electron/package.json'); if (p.version !== '35.7.5') process.exit(1); console.log('electron', p.version)"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Run repository quality checks
        run: npm run quality:check

      - name: Build Linux AppImage
        run: npm run build:desktop:linux -- --publish=never

      - name: Verify fail-closed AppImage launcher
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t appimages < <(find release -maxdepth 1 -type f -name '*.AppImage' | sort)
          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}" >&2
            exit 1
          fi
          appimage_path="${appimages[0]}"
          chmod +x "$appimage_path"
          (
            cd release
            sha256sum "$(basename "$appimage_path")" > SHA256SUMS.txt
          )
          rm -rf release/squashfs-root
          (cd release && "./$(basename "$appimage_path")" --appimage-extract >/dev/null)
          app_run="release/squashfs-root/AppRun"
          desktop_file="$(find release/squashfs-root -maxdepth 1 -type f -name '*.desktop' -print -quit)"

          bash -n "$app_run"
          grep -Fq 'export LD_LIBRARY_PATH="${APPDIR}/usr/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"' "$app_run"
          grep -Fq 'ERROR: --no-sandbox is disabled by this AppImage security policy.' "$app_run"
          grep -Fq 'ERROR: Chromium sandbox prerequisites are unavailable; refusing to launch unsandboxed.' "$app_run"
          grep -Fq 'if ! command -v unshare >/dev/null 2>&1 || ! unshare -Ur true 2>/dev/null ; then' "$app_run"
          grep -Fq 'Exec=AppRun --enable-sandbox %U' "$desktop_file"

          if grep -Fq 'NO_SANDBOX=(--no-sandbox)' "$app_run"; then
            echo "Automatic --no-sandbox fallback is still present" >&2
            exit 1
          fi
          if grep -Fq '${NO_SANDBOX[@]}' "$app_run"; then
            echo "Automatic sandbox-bypass forwarding is still present" >&2
            exit 1
          fi
          if grep -Fq 'This is an intentional fail-safe: we prefer the app to start' "$app_run"; then
            echo "Upstream fail-open sandbox policy remains in AppRun" >&2
            exit 1
          fi
          if grep -Fq 'Exec=AppRun --no-sandbox' "$desktop_file"; then
            echo "Desktop launcher disables sandbox" >&2
            exit 1
          fi

          set +e
          (
            cd release/squashfs-root
            ./AppRun --no-sandbox
          ) > release/apprun-no-sandbox.stdout 2> release/apprun-no-sandbox.stderr
          reject_rc=$?
          set -e
          if [[ "$reject_rc" -ne 1 ]]; then
            echo "Expected AppRun --no-sandbox to exit 1, got $reject_rc" >&2
            cat release/apprun-no-sandbox.stdout >&2 || true
            cat release/apprun-no-sandbox.stderr >&2 || true
            exit 1
          fi
          grep -Fxq 'ERROR: --no-sandbox is disabled by this AppImage security policy.' release/apprun-no-sandbox.stderr
          if grep -Fq 'command not found' release/apprun-no-sandbox.stderr; then
            echo "Sandbox rejection triggered an unexpected shell error" >&2
            cat release/apprun-no-sandbox.stderr >&2
            exit 1
          fi

          echo "Fail-closed AppRun policy validated"
          cat "$desktop_file"
          cat release/SHA256SUMS.txt

      - name: Report build sizes
        run: node scripts/report-build-metrics.cjs release/build-metrics.json

      - name: Measure packaged startup
        shell: bash
        run: |
          set -euo pipefail
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          xvfb-run -a node scripts/measure-startup.cjs release/startup-metrics.json

      - name: Upload validation artifact
        uses: actions/upload-artifact@v6
        with:
          name: checkpoint1-fail-closed-appimage
          path: |
            release/*.AppImage
            release/SHA256SUMS.txt
            release/build-metrics.json
            release/startup-metrics.json
          if-no-files-found: error
