name: Phase 5 Native Parity

on:
  pull_request:
    branches:
      - v3-restart
    paths:
      - '.github/workflows/phase5-native-parity.yml'
      - 'desktop/native/**'
      - 'scripts/build-phase5-accessibility-probe.sh'
      - 'scripts/build-phase5-native-host.sh'
      - 'scripts/run-phase5-accessibility-probe.sh'
      - 'scripts/validate-phase5-accessibility.py'
      - 'scripts/seed-electron-migration-fixture.cjs'
      - 'scripts/inspect-electron-migration-fixture.cjs'
      - 'scripts/validate-electron-migration-fixture.cjs'
      - 'scripts/validate-electron-preferences-import.cjs'
      - 'src/resources/js/input_frame.cjs'
      - 'src/resources/js/keyboard.js'
      - 'src/resources/js/native_app.js'
      - 'src/resources/js/settings_store.cjs'
      - 'src/resources/js/control_bindings.cjs'
      - 'src/resources/js/utils/local_storage_wrapper.js'
      - 'test/input_frame.test.cjs'
      - 'webpack.native.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-native-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  accessibility-feasibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install native and AT-SPI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl xz-utils git \
            xvfb x11-utils dbus-x11 at-spi2-core python3-pyatspi \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Build pinned SDL3 and AccessKit probe
        shell: bash
        run: bash scripts/build-phase5-accessibility-probe.sh

      - name: Exercise semantic tree through AT-SPI
        shell: bash
        run: dbus-run-session -- bash scripts/run-phase5-accessibility-probe.sh

      - name: Report accessibility evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Phase 5 accessibility feasibility'
            echo ''
            for file in \
              build/phase5/accessibility/evidence/build-summary.txt \
              build/phase5/accessibility/evidence/runtime-summary.txt \
              build/phase5/accessibility/evidence/runtime-state.txt; do
              if [[ -s "$file" ]]; then
                echo "### $(basename "$file")"
                echo '```text'
                cat "$file"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload accessibility evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase5-accessibility-feasibility
          path: build/phase5/accessibility/evidence/**
          if-no-files-found: warn
          retention-days: 14

  electron-migration-layout:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install migration probe dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libleveldb-dev

      - name: Install web dependencies
        run: npm ci

      - name: Build production web payload
        run: npm run build:web

      - name: Seed controlled Electron 2.1 preferences
        shell: bash
        run: |
          set -euo pipefail
          user_data="$RUNNER_TEMP/pv-electron-user-data"
          report="$RUNNER_TEMP/pv-electron-seed.json"
          rm -rf "$user_data"
          mkdir -p "$user_data"
          PV_MIGRATION_USER_DATA="$user_data" \
          PV_MIGRATION_REPORT="$report" \
            xvfb-run -a npx electron --no-sandbox scripts/seed-electron-migration-fixture.cjs
          test -s "$report"
          echo "PV_MIGRATION_USER_DATA=$user_data" >> "$GITHUB_ENV"
          echo "PV_MIGRATION_REPORT=$report" >> "$GITHUB_ENV"

      - name: Inspect actual Chromium localStorage layout
        shell: bash
        run: |
          set -euo pipefail
          evidence='build/phase5/migration'
          mkdir -p "$evidence"
          local_storage="$PV_MIGRATION_USER_DATA/Local Storage"
          test -d "$local_storage"
          cp "$PV_MIGRATION_REPORT" "$evidence/seed-report.json"
          node scripts/inspect-electron-migration-fixture.cjs "$local_storage" \
            > "$evidence/storage-inspection.json"
          node scripts/validate-electron-migration-fixture.cjs \
            "$evidence/seed-report.json" \
            "$evidence/storage-inspection.json" \
            | tee "$evidence/layout-validation.json"

      - name: Prove bounded LevelDB preference import
        shell: bash
        run: |
          set -euo pipefail
          evidence='build/phase5/migration'
          database="$PV_MIGRATION_USER_DATA/Local Storage/leveldb"
          database_copy="$RUNNER_TEMP/pv-electron-leveldb-copy"
          rm -rf "$database_copy"
          cp -a "$database" "$database_copy"
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            desktop/native/electron_preferences_importer.cc \
            -o "$evidence/electron-preferences-importer" \
            -lleveldb -lpthread
          ldd "$evidence/electron-preferences-importer" \
            | tee "$evidence/importer-ldd.txt"
          if grep -q 'not found' "$evidence/importer-ldd.txt"; then
            echo 'Electron preference importer has unresolved libraries.' >&2
            exit 1
          fi
          "$evidence/electron-preferences-importer" \
            "$database_copy" "$evidence/imported-preferences.json" \
            | tee "$evidence/importer-runtime.txt"
          node scripts/validate-electron-preferences-import.cjs \
            "$evidence/seed-report.json" \
            "$evidence/imported-preferences.json" \
            | tee "$evidence/import-validation.json"
          {
            echo "importer_bytes=$(stat -c%s "$evidence/electron-preferences-importer")"
            echo "importer_sha256=$(sha256sum "$evidence/electron-preferences-importer" | awk '{print $1}')"
            echo "imported_preferences_sha256=$(sha256sum "$evidence/imported-preferences.json" | awk '{print $1}')"
          } | tee "$evidence/importer-summary.txt"

      - name: Report migration evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Phase 5 Electron preference migration layout'
            echo ''
            for file in \
              build/phase5/migration/layout-validation.json \
              build/phase5/migration/import-validation.json \
              build/phase5/migration/importer-summary.txt \
              build/phase5/migration/storage-inspection.json; do
              if [[ -s "$file" ]]; then
                echo "### $(basename "$file")"
                echo '```text'
                cat "$file"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload migration evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase5-electron-migration-layout
          path: build/phase5/migration/**
          if-no-files-found: warn
          retention-days: 14

  native-host-core-bridge:
    needs:
      - accessibility-feasibility
      - electron-migration-layout
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install web dependencies
        run: npm ci

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl xz-utils patchelf xvfb \
            libpng-dev libmpg123-dev libfreetype6-dev libharfbuzz-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Build and validate production native core bridge
        shell: bash
        run: bash scripts/build-phase5-native-host.sh

      - name: Report native host evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary='build/phase5/native-host/evidence/summary.txt'
          if [[ -s "$summary" ]]; then
            {
              echo '## Phase 5 production native host bridge'
              echo ''
              echo '```text'
              cat "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Phase 5.2 did not reach final native-host evidence generation.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload native host evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase5-native-host-core-bridge
          path: |
            build/phase5/native-host/*.AppImage
            build/phase5/native-host/SHA256SUMS.txt
            build/phase5/native-host/evidence/**
          if-no-files-found: warn
          retention-days: 14
