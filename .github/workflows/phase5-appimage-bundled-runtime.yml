name: Phase 5 AppImage Bundled Runtime

on:
  push:
    branches:
      - v3-phase5-linux-distribution
    paths:
      - '.github/workflows/phase5-appimage-bundled-runtime.yml'
      - 'packaging/linux/appimage-spike.env'
      - 'packaging/linux/metadata.env'
      - 'scripts/build-neutralino-appimage-spike.sh'
      - 'scripts/run-neutralino-appimage-runtime-smoke.sh'
      - 'scripts/*neutralino*'
      - 'desktop/neutralino/**'
      - 'test/linux_appimage_spike.test.cjs'
      - 'test/neutralino/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack*.js'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase5-appimage-bundled-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate1-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      run_id: ${{ steps.wait-for-thin.outputs.run_id }}
    steps:
      - name: Wait for exact-head Candidate 1 success
        id: wait-for-thin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='phase5-appimage-portability-spike.yml'
          for attempt in $(seq 1 240); do
            response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$GITHUB_REF_NAME&per_page=20")"
            run_id="$(printf '%s' "$response" | jq -r --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | .id // empty')"
            if [[ -z "$run_id" ]]; then
              printf 'PV_APPIMAGE_CANDIDATE1_GATE_WAIT attempt=%s reason=no_exact_head_run sha=%s\n' "$attempt" "$GITHUB_SHA"
              sleep 20
              continue
            fi
            status="$(printf '%s' "$response" | jq -r --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | .status')"
            conclusion="$(printf '%s' "$response" | jq -r --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last | (.conclusion // "")')"
            if [[ "$status" != completed ]]; then
              printf 'PV_APPIMAGE_CANDIDATE1_GATE_WAIT attempt=%s run_id=%s status=%s\n' "$attempt" "$run_id" "$status"
              sleep 20
              continue
            fi
            if [[ "$conclusion" != success ]]; then
              printf 'Candidate 1 exact-head workflow failed: run_id=%s conclusion=%s sha=%s\n' \
                "$run_id" "$conclusion" "$GITHUB_SHA" >&2
              exit 1
            fi
            printf 'PV_APPIMAGE_CANDIDATE1_GATE=PASS run_id=%s sha=%s\n' "$run_id" "$GITHUB_SHA"
            printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo 'Timed out waiting for exact-head Candidate 1 success.' >&2
          exit 1

  build-bundled-candidate:
    needs: candidate1-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PV_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Assert AppImage spike structure
        run: node --test test/linux_appimage_spike.test.cjs
      - name: Download exact-head Candidate 1 evidence
        uses: actions/download-artifact@v5
        with:
          name: phase5-appimage-portability-spike-candidates
          path: .candidate1
          github-token: ${{ github.token }}
          run-id: ${{ needs.candidate1-gate.outputs.run_id }}
      - name: Build and verify accepted Neutralino production input
        shell: bash
        run: |
          set -euo pipefail
          npm run build:desktop:neutralino
          source packaging/linux/metadata.env
          sha256sum -c pikachu-volleyball-neutralino-production-parity-linux-x64.tar.gz.sha256
          rm -rf .appimage-bundled-production
          mkdir .appimage-bundled-production
          tar -xzf pikachu-volleyball-neutralino-production-parity-linux-x64.tar.gz -C .appimage-bundled-production
          bundle="$PWD/.appimage-bundled-production/$PV_INTERNAL_BUNDLE_NAME"
          (cd "$bundle" && sha256sum -c SHA256SUMS)
          thin_appdir="$PWD/.candidate1/inspection/thin/squashfs-root"
          cmp "$bundle/$PV_BINARY_NAME" "$thin_appdir/usr/bin/$PV_BINARY_NAME"
          cmp "$bundle/extensions/$PV_EXTENSION_NAME" "$thin_appdir/usr/bin/extensions/$PV_EXTENSION_NAME"
          printf 'PV_APPIMAGE_BUNDLED_CORE_IDENTITY binary_sha256=%s helper_sha256=%s candidate1_run_id=%s\n' \
            "$(sha256sum "$bundle/$PV_BINARY_NAME" | awk '{print $1}')" \
            "$(sha256sum "$bundle/extensions/$PV_EXTENSION_NAME" | awk '{print $1}')" \
            '${{ needs.candidate1-gate.outputs.run_id }}'
      - name: Build bundled AppImage candidate twice
        shell: bash
        run: |
          set -euo pipefail
          source packaging/linux/metadata.env
          source packaging/linux/appimage-spike.env
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          bundle="/workspace/.appimage-bundled-production/$PV_INTERNAL_BUNDLE_NAME"
          build_once() {
            local name="$1"
            rm -rf ".appimage-bundled-repro/$name" ".appimage-bundled-evidence/$name"
            mkdir -p ".appimage-bundled-repro/$name" ".appimage-bundled-evidence/$name" .appimage-bundled-tools
            docker run --rm --platform linux/amd64 \
              -e PV_PRODUCTION_BUNDLE="$bundle" \
              -e PV_APPIMAGE_OUTPUT="/workspace/.appimage-bundled-repro/$name" \
              -e PV_APPIMAGE_EVIDENCE="/workspace/.appimage-bundled-evidence/$name" \
              -e PV_APPIMAGE_TOOLS_DIR=/workspace/.appimage-bundled-tools \
              -v "$PWD:/workspace" -w /workspace \
              --mount type=bind,src=/etc/ssl/certs/ca-certificates.crt,dst=/tmp/pv-host-ca.crt,readonly \
              "$PV_APPIMAGE_BUILDER_IMAGE" bash -lc '
                set -euo pipefail
                source packaging/linux/appimage-spike.env
                export DEBIAN_FRONTEND=noninteractive
                sed -i "s/^deb /deb [snapshot=$PV_APPIMAGE_APT_SNAPSHOT] /" /etc/apt/sources.list
                printf "Acquire::https::CaInfo \"/tmp/pv-host-ca.crt\";\n" > /etc/apt/apt.conf.d/49pv-bootstrap-ca
                snapshot_ready=0
                for attempt in 1 2 3 4; do
                  rm -rf /var/lib/apt/lists/*
                  if apt-get update 2>&1 | tee /tmp/pv-appimage-bundled-apt-update.log && \
                    grep -F "snapshot.ubuntu.com/ubuntu/$PV_APPIMAGE_APT_SNAPSHOT" /tmp/pv-appimage-bundled-apt-update.log >/dev/null && \
                    ! grep -Eq "^(W: Failed to fetch|W: Some index files failed to download)" /tmp/pv-appimage-bundled-apt-update.log; then
                    snapshot_ready=1
                    break
                  fi
                  printf "PV_APPIMAGE_BUNDLED_APT_RETRY attempt=%s snapshot=%s\n" "$attempt" "$PV_APPIMAGE_APT_SNAPSHOT" >&2
                  sleep "$((attempt * 5))"
                done
                if (( snapshot_ready != 1 )); then
                  cat /tmp/pv-appimage-bundled-apt-update.log >&2
                  echo "Pinned AppImage snapshot indexes did not download completely." >&2
                  exit 1
                fi
                packages_ready=0
                for attempt in 1 2 3 4; do
                  if apt-get install -y --no-install-recommends \
                    ca-certificates curl file findutils pkg-config dpkg-dev patchelf binutils squashfs-tools \
                    libgtk-3-dev libgirepository1.0-dev librsvg2-dev \
                    libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
                    libgstreamer1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base \
                    gstreamer1.0-plugins-good gstreamer1.0-pulseaudio bubblewrap xdg-dbus-proxy; then
                    packages_ready=1
                    break
                  fi
                  printf "PV_APPIMAGE_BUNDLED_APT_INSTALL_RETRY attempt=%s snapshot=%s\n" "$attempt" "$PV_APPIMAGE_APT_SNAPSHOT" >&2
                  sleep "$((attempt * 5))"
                done
                if (( packages_ready != 1 )); then
                  echo "Pinned AppImage snapshot packages did not download completely." >&2
                  exit 1
                fi
                rm -f /etc/apt/apt.conf.d/49pv-bootstrap-ca
                bash scripts/build-neutralino-appimage-spike.sh bundled
              '
            sudo chown -R "$host_uid:$host_gid" ".appimage-bundled-repro/$name" ".appimage-bundled-evidence/$name" .appimage-bundled-tools
          }
          build_once first
          build_once second
          cmp ".appimage-bundled-repro/first/$PV_APPIMAGE_BUNDLED_NAME" ".appimage-bundled-repro/second/$PV_APPIMAGE_BUNDLED_NAME"
      - name: Inspect exact bundled candidate and runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          source packaging/linux/metadata.env
          source packaging/linux/appimage-spike.env
          bundle="$PWD/.appimage-bundled-production/$PV_INTERNAL_BUNDLE_NAME"
          source_file="$PWD/.appimage-bundled-repro/first/$PV_APPIMAGE_BUNDLED_NAME"
          runtime_file="$PWD/.appimage-bundled-tools/runtime-x86_64"
          rm -rf appimage-bundled-candidate .appimage-bundled-inspection
          mkdir -p appimage-bundled-candidate .appimage-bundled-inspection
          cp "$source_file" "appimage-bundled-candidate/$PV_APPIMAGE_BUNDLED_NAME"
          chmod 0755 "appimage-bundled-candidate/$PV_APPIMAGE_BUNDLED_NAME"
          test "$(sha256sum "$runtime_file" | awk '{print $1}')" = "$PV_APPIMAGE_RUNTIME_SHA256"
          runtime_offset="$("$source_file" --appimage-offset)"
          [[ "$runtime_offset" =~ ^[0-9]+$ ]]
          test "$runtime_offset" -gt 0
          test "$runtime_offset" -lt "$(stat -c%s "$source_file")"
          (
            cd .appimage-bundled-inspection
            "$source_file" --appimage-extract >/dev/null
          )
          appdir="$PWD/.appimage-bundled-inspection/squashfs-root"
          cmp "$bundle/$PV_BINARY_NAME" "$appdir/usr/bin/$PV_BINARY_NAME"
          cmp "$bundle/extensions/$PV_EXTENSION_NAME" "$appdir/usr/bin/extensions/$PV_EXTENSION_NAME"
          find "$appdir" -printf '%P\t%y\t%s\n' | sort > .appimage-bundled-inspection/bundled-final-inventory.txt
          if find "$appdir" -type f -printf '%P\n' | grep -Eiq '(^|/)(electron|electron-builder|chrome-sandbox|app\.asar|node|nodejs|python3?|gcc|g\+\+|cmake|ninja)(/|$)|node_modules'; then
            echo 'Forbidden runtime/build payload found in bundled AppImage' >&2
            exit 1
          fi
          if find "$appdir/usr/lib" \( -type f -o -type l \) -printf '%f\n' | \
            grep -Eq '^(libc\.so\.|ld-linux|libpthread\.so\.|libdl\.so\.|librt\.so\.|libm\.so\.)'; then
            echo 'Bundled AppImage unexpectedly contains glibc/ELF loader payload' >&2
            exit 1
          fi
          if find "$appdir/usr/lib" \( -type f -o -type l \) -printf '%P\n' | \
            grep -Eq '(^|/)(libEGL(\.so\.|_mesa\.so\.)|libgbm\.so\.|libGL\.so\.|libGLX[^/]*\.so\.|libGLdispatch\.so\.|libOpenGL\.so\.|libGLES[^/]*\.so\.|libdrm\.so\.|[^/]*_dri\.so)|(^|/)dri/|(^|/)egl_vendor\.d/'; then
            echo 'Bundled AppImage unexpectedly contains host graphics driver payload' >&2
            exit 1
          fi
          find "$appdir/usr/lib" -name 'libwebkit2gtk-4.1.so*' -print -quit | grep -q .
          find "$appdir/usr/lib" -name 'libgtk-3.so*' -print -quit | grep -q .
          find "$appdir/usr/lib" -name 'libgstreamer-1.0.so*' -print -quit | grep -q .
          test -x "$appdir/usr/lib/webkit2gtk-4.1/WebKitWebProcess"
          test -f "$appdir/usr/lib/gstreamer-1.0/libgstwavparse.so"
          test -f "$appdir/usr/lib/gstreamer-1.0/libgstmpg123.so"
          test -x "$appdir/usr/libexec/gstreamer-1.0/gst-plugin-scanner"
          test ! -e "$appdir/usr/bin/xdg-open"
          grep -F 'command -v xdg-open' "$appdir/AppRun" >/dev/null
          bytes="$(stat -c%s "$source_file")"
          sha="$(sha256sum "$source_file" | awk '{print $1}')"
          core_bytes="$(( $(stat -c%s "$bundle/$PV_BINARY_NAME") + $(stat -c%s "$bundle/extensions/$PV_EXTENSION_NAME") + $(stat -c%s "$bundle/provenance.json") + $(stat -c%s "$bundle/SHA256SUMS") ))"
          printf 'bundled\t%s\t%s\t%s\t%s\n' "$bytes" "$sha" "$runtime_offset" "$core_bytes" \
            > .appimage-bundled-inspection/summary.tsv
          printf 'PV_APPIMAGE_CANDIDATE kind=bundled bytes=%s mib=%s sha256=%s runtime_offset=%s core_payload_bytes=%s\n' \
            "$bytes" "$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b/1048576 }')" "$sha" "$runtime_offset" "$core_bytes"
          cp -a .appimage-bundled-evidence/first appimage-bundled-candidate/build-evidence
          cp -a .appimage-bundled-inspection appimage-bundled-candidate/inspection
          cp .candidate1/neutralino-validation-overlay.tar.gz appimage-bundled-candidate/
          (
            cd appimage-bundled-candidate
            sha256sum "$PV_APPIMAGE_BUNDLED_NAME" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Upload bundled runtime candidate
        uses: actions/upload-artifact@v4
        with:
          name: phase5-appimage-bundled-runtime-candidate
          path: appimage-bundled-candidate/
          if-no-files-found: error
          retention-days: 14

  bundled-runtime-matrix:
    needs: build-bundled-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: debian-12
            family: debian
            image: debian:bookworm-20260824-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
          - label: ubuntu-22.04
            family: debian
            image: ubuntu:jammy-20260810@sha256:79676deb51ebb02885b0b9d33788e78a37cf1045ad79d1bb04c6a222c3556b3d
          - label: ubuntu-24.04
            family: debian
            image: ubuntu:noble-20260810@sha256:1e0a86e57d247923571b75e0aaf48a1449cf8c543d51fb3e07a4a7d7bfa79316
          - label: fedora-44
            family: fedora
            image: fedora:44@sha256:be9d65e2344d805cc11114319c685ecaa96b6d9b4350a0a6460cdb931babbd19
          - label: opensuse-leap-16.0
            family: opensuse
            image: opensuse/leap:16.0@sha256:77732aa024f765ecdb4067affdea9e386d68056d0d281608ce4665d8fb0b4edd
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v5
        with:
          name: phase5-appimage-bundled-runtime-candidate
          path: .appimage-bundled-download
      - name: Validate bundled candidate without host app desktop packages
        shell: bash
        env:
          PV_MATRIX_IMAGE: ${{ matrix.image }}
          PV_MATRIX_FAMILY: ${{ matrix.family }}
          PV_MATRIX_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          source packaging/linux/appimage-spike.env
          candidate_name="$PV_APPIMAGE_BUNDLED_NAME"
          chmod 0755 ".appimage-bundled-download/$candidate_name"
          rm -rf .appimage-bundled-runtime-results .neutralino-production
          mkdir .appimage-bundled-runtime-results
          tar -xzf .appimage-bundled-download/neutralino-validation-overlay.tar.gz
          docker run --rm --platform linux/amd64 --shm-size=1g \
            -e PV_MATRIX_FAMILY="$PV_MATRIX_FAMILY" \
            -e PV_MATRIX_LABEL="$PV_MATRIX_LABEL" \
            -e PV_CANDIDATE_NAME="$candidate_name" \
            -v "$PWD:/workspace" -w /workspace "$PV_MATRIX_IMAGE" bash -lc '
              set -euo pipefail
              graphics_packages=""
              assert_debian_absent() {
                local package
                for package in \
                  libgtk-3-0 libgtk-3-0t64 libwebkit2gtk-4.1-0 libwebkit2gtk-4.0-37 \
                  libgstreamer1.0-0 libgstreamer1.0-0t64 gstreamer1.0-plugins-base gstreamer1.0-plugins-good; do
                  if dpkg-query -W -f="\${Status}" "$package" 2>/dev/null | grep -q "install ok installed"; then
                    echo "Unexpected host app package installed: $package" >&2
                    exit 1
                  fi
                done
              }
              assert_rpm_absent() {
                local package
                for package in "$@"; do
                  if rpm -q "$package" >/dev/null 2>&1; then
                    echo "Unexpected host app package installed: $package" >&2
                    exit 1
                  fi
                done
              }
              case "$PV_MATRIX_FAMILY" in
                debian)
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update
                  graphics_packages="libegl1 libegl-mesa0 libgbm1 libgl1-mesa-dri"
                  apt-get install -y --no-install-recommends \
                    xvfb openbox xdotool procps dbus-x11 python3 passwd time ca-certificates xdg-utils \
                    $graphics_packages
                  assert_debian_absent
                  ;;
                fedora)
                  graphics_packages="libglvnd-egl mesa-libEGL mesa-libgbm mesa-dri-drivers"
                  dnf -y install xorg-x11-server-Xvfb openbox xdotool procps-ng dbus-x11 python3 shadow-utils time ca-certificates xdg-utils \
                    $graphics_packages
                  assert_rpm_absent webkit2gtk4.1 gtk3 gstreamer1 gstreamer1-plugins-base gstreamer1-plugins-good
                  ;;
                opensuse)
                  zypper --non-interactive refresh
                  graphics_packages="libglvnd Mesa-libEGL1 libgbm1 Mesa-dri"
                  zypper --non-interactive install --no-recommends \
                    xorg-x11-server-Xvfb openbox xdotool procps python3 shadow time ca-certificates xdg-utils \
                    $graphics_packages
                  assert_rpm_absent libwebkit2gtk-4_1-0 gtk3 libgtk-3-0 gstreamer libgstreamer-1_0-0 gstreamer-plugins-base gstreamer-plugins-good
                  ;;
                *) echo "Unknown matrix family: $PV_MATRIX_FAMILY" >&2; exit 2 ;;
              esac
              printf "PV_APPIMAGE_HOST_APP_PACKAGES=ABSENT label=%s\n" "$PV_MATRIX_LABEL"
              printf "PV_APPIMAGE_HOST_GRAPHICS_BASELINE=READY label=%s family=%s packages=%s\n" \
                "$PV_MATRIX_LABEL" "$PV_MATRIX_FAMILY" "$graphics_packages"
              useradd -m pvsmoke 2>/dev/null || true
              stage=/tmp/pv-appimage-bundled-validation-stage
              tmp_result=/tmp/pv-appimage-bundled-runtime-result
              rm -rf "$stage" "$tmp_result"
              cp -a /workspace/.neutralino-production "$stage"
              mkdir -p "$tmp_result"
              chown -R pvsmoke:pvsmoke "$stage" "$tmp_result"
              result="/workspace/.appimage-bundled-runtime-results/${PV_MATRIX_LABEL}-bundled"
              mkdir -p "$result"
              printf "matrix_label=%s\nfamily=%s\ngraphics_packages=%s\n" \
                "$PV_MATRIX_LABEL" "$PV_MATRIX_FAMILY" "$graphics_packages" > "$result/host-graphics-baseline.txt"
              set +e
              runuser -u pvsmoke -- bash /workspace/scripts/run-neutralino-appimage-runtime-smoke.sh \
                "$stage" "/workspace/.appimage-bundled-download/$PV_CANDIDATE_NAME" "$tmp_result" extract
              status=$?
              set -e
              cp -a "$tmp_result/." "$result/"
              printf "matrix_label=%s\ncandidate=bundled\nexit_code=%s\n" "$PV_MATRIX_LABEL" "$status" > "$result/matrix-status.txt"
              if [[ "$status" -eq 0 ]]; then
                printf "PV_APPIMAGE_MATRIX_RESULT label=%s candidate=bundled result=PASS\n" "$PV_MATRIX_LABEL"
              else
                printf "PV_APPIMAGE_MATRIX_RESULT label=%s candidate=bundled result=FAIL exit_code=%s\n" "$PV_MATRIX_LABEL" "$status"
                exit "$status"
              fi
            '
      - name: Upload bundled runtime matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-runtime-${{ matrix.label }}-bundled
          path: .appimage-bundled-runtime-results/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  bundled-hosted-fuse:
    needs: build-bundled-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v5
        with:
          name: phase5-appimage-bundled-runtime-candidate
          path: .appimage-bundled-download
      - name: Exercise bundled direct FUSE and extract-and-run fallback
        shell: bash
        run: |
          set -euo pipefail
          source packaging/linux/appimage-spike.env
          sudo apt-get update
          fuse_pkg=libfuse2t64
          apt-cache show "$fuse_pkg" >/dev/null 2>&1 || fuse_pkg=libfuse2
          graphics_packages="libegl1 libegl-mesa0 libgbm1 libgl1-mesa-dri"
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox xdotool procps dbus-x11 xdg-utils "$fuse_pkg" $graphics_packages
          printf 'PV_APPIMAGE_HOST_GRAPHICS_BASELINE=READY label=hosted-fuse family=debian packages=%s\n' \
            "$graphics_packages"
          rm -rf .appimage-bundled-fuse-results .neutralino-production \
            .appimage-bundled-fuse-stage-extract .appimage-bundled-fuse-stage-direct
          mkdir -p .appimage-bundled-fuse-results/bundled
          candidate="$PWD/.appimage-bundled-download/$PV_APPIMAGE_BUNDLED_NAME"
          result="$PWD/.appimage-bundled-fuse-results/bundled"
          printf 'label=hosted-fuse\nfamily=debian\ngraphics_packages=%s\n' "$graphics_packages" \
            > "$result/host-graphics-baseline.txt"
          chmod 0755 "$candidate"

          tar -xzf .appimage-bundled-download/neutralino-validation-overlay.tar.gz
          mv .neutralino-production .appimage-bundled-fuse-stage-extract
          if bash scripts/run-neutralino-appimage-runtime-smoke.sh \
            .appimage-bundled-fuse-stage-extract "$candidate" "$result/extract-and-run-evidence" extract \
            >"$result/extract-and-run.log" 2>&1; then
            echo PASS > "$result/extract-and-run.txt"
          else
            status=$?
            printf 'FAIL exit_code=%s\n' "$status" > "$result/extract-and-run.txt"
            cat "$result/extract-and-run.log" >&2
            exit "$status"
          fi

          if [[ -c /dev/fuse ]]; then
            tar -xzf .appimage-bundled-download/neutralino-validation-overlay.tar.gz
            mv .neutralino-production .appimage-bundled-fuse-stage-direct
            if bash scripts/run-neutralino-appimage-runtime-smoke.sh \
              .appimage-bundled-fuse-stage-direct "$candidate" "$result/direct-fuse-evidence" direct \
              >"$result/direct-fuse.log" 2>&1; then
              echo PASS > "$result/direct-fuse.txt"
            else
              status=$?
              printf 'FAIL exit_code=%s\n' "$status" > "$result/direct-fuse.txt"
              cat "$result/direct-fuse.log" >&2
              exit "$status"
            fi
          else
            echo SKIP_NO_DEV_FUSE > "$result/direct-fuse.txt"
          fi
      - name: Upload bundled hosted FUSE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-bundled-hosted-fuse-evidence
          path: .appimage-bundled-fuse-results/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
