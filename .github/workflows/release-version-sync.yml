name: Sync release version

on:
  push:
    branches:
      - v2-release-quality

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: v2-release-quality

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Set stable release version
        run: npm version 2.0.0 --no-git-tag-version --allow-same-version

      - name: Remove temporary workflow
        run: git rm .github/workflows/release-version-sync.yml

      - name: Commit synchronized release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Set release version to 2.0.0"
          git push origin HEAD:v2-release-quality
