name: Neutralino Compatibility Spike

on:
  push:
    branches:
      - v3-phase1-neutralino-spike
      - v3-phase2-desktop-platform-boundary
  pull_request:
    branches:
      - v3
    paths:
      - '.github/workflows/neutralino-spike.yml'
      - 'desktop/external-link-policy.cjs'
      - 'desktop/neutralino-spike/**'
      - 'scripts/build-neutralino-external-link-extension.sh'
      - 'scripts/build-neutralino-host-navigation-runtime.sh'
      - 'scripts/prepare-neutralino-spike.cjs'
      - 'scripts/report-neutralino-spike.cjs'
      - 'scripts/run-neutralino-external-link-smoke.sh'
      - 'scripts/run-neutralino-fedora-smoke.sh'
      - 'scripts/run-neutralino-host-navigation-smoke.sh'
      - 'scripts/validate-neutralino-external-link-extension.cjs'
      - 'test/desktop_platform_boundary.test.cjs'
      - 'test/neutralino_spike.test.cjs'
      - 'src/**'
      - 'webpack*.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neutralino-spike-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Run repository quality checks
        run: npm run quality:check

      - name: Prepare production web output for Neutralino
        run: node scripts/prepare-neutralino-spike.cjs

      - name: Build trusted external-link extension
        run: ./scripts/build-neutralino-external-link-extension.sh

      - name: Validate Electron and Neutralino external-link policy equivalence
        run: node scripts/validate-neutralino-external-link-extension.cjs

      - name: Fetch pinned Neutralino runtime and client
        working-directory: .neutralino-spike
        run: npx -y @neutralinojs/neu@11.7.2 update

      - name: Build patched host-navigation Neutralino runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:20.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y -f \
                ca-certificates \
                git \
                g++ \
                pkg-config \
                cmake \
                ninja-build \
                libgtk-3-dev \
                libwebkit2gtk-4.0-dev
              /workspace/scripts/build-neutralino-host-navigation-runtime.sh \
                /workspace/.neutralino-spike/bin/neutralino-linux_x64
            '
          sudo chown "$(id -u):$(id -g)" \
            .neutralino-spike/bin/neutralino-linux_x64 \
            .neutralino-spike/neutralino-host-navigation-runtime.json

      - name: Build embedded Neutralino artifacts
        working-directory: .neutralino-spike
        run: npx -y @neutralinojs/neu@11.7.2 build --embed-resources

      - name: Report Linux artifact metrics
        run: node scripts/report-neutralino-spike.cjs

      - name: Prepare Fedora smoke instrumentation
        run: node scripts/prepare-neutralino-spike.cjs --smoke-only

      - name: Run Fedora 44 WebKitGTK smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --shm-size=1g \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:44 \
            bash -lc '
              set -euo pipefail
              dnf -y install \
                webkit2gtk4.1 \
                gtk3 \
                xorg-x11-server-Xvfb \
                openbox \
                xdotool \
                procps-ng \
                time \
                gstreamer1-plugins-base \
                gstreamer1-plugins-good \
                dbus-x11 \
                python3 \
                shadow-utils
              useradd -m pvsmoke
              chmod -R a+rwX /workspace/.neutralino-spike
              runuser -u pvsmoke -- \
                /workspace/scripts/run-neutralino-fedora-smoke.sh \
                /workspace/.neutralino-spike
              runuser -u pvsmoke -- \
                /workspace/scripts/run-neutralino-external-link-smoke.sh \
                /workspace/.neutralino-spike
              runuser -u pvsmoke -- \
                /workspace/scripts/run-neutralino-host-navigation-smoke.sh \
                /workspace/.neutralino-spike
            '

      - name: Collect experimental Linux artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p neutralino-spike-artifact
          if [[ -d .neutralino-spike/fedora-smoke ]]; then
            cp -R .neutralino-spike/fedora-smoke neutralino-spike-artifact/
          fi
          if [[ -d .neutralino-spike/fedora-external-link-smoke ]]; then
            cp -R .neutralino-spike/fedora-external-link-smoke neutralino-spike-artifact/
          fi
          if [[ -d .neutralino-spike/fedora-host-navigation-smoke ]]; then
            cp -R .neutralino-spike/fedora-host-navigation-smoke neutralino-spike-artifact/
          fi

      - name: Upload experimental artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neutralino-spike-linux-x64
          path: neutralino-spike-artifact/
          if-no-files-found: error
          retention-days: 14
