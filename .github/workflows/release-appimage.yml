name: Build Linux AppImage

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 100

    steps:
      - name: Check out release authority
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Validate release metadata boundary
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          [[ "$package_version" == "$lock_version" ]] || {
            echo "package.json and package-lock.json versions differ." >&2
            exit 1
          }

          release_notes="docs/releases/v${package_version}.md"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            expected_tag="v${package_version}"
            actual_tag="${{ github.event.release.tag_name }}"
            [[ "$actual_tag" == "$expected_tag" ]] || {
              echo "Release tag $actual_tag does not match package version $expected_tag" >&2
              exit 1
            }
            test -s "$release_notes" || {
              echo "Missing release notes: $release_notes" >&2
              exit 1
            }
          fi

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Run repository quality checks
        run: npm run quality:check

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl xz-utils patchelf \
            binutils file libfuse2 xvfb x11-utils dbus-x11 at-spi2-core \
            python3-pyatspi libpng-dev libmpg123-dev libfreetype6-dev \
            libharfbuzz-dev libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Build validated native AppImage
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/build/release"
          PV_NATIVE_RELEASE_ROOT="$root" bash scripts/build-native-appimage.sh
          grep -Fxq 'native_release_builder=PASS' "$root/evidence/summary.txt"
          grep -Fxq 'direct_appimage_self_test=PASS' "$root/evidence/summary.txt"
          grep -Fxq 'legacy_electron_fixture=PASS' "$root/evidence/summary.txt"

      - name: Validate production accessibility
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- env PV_PHASE5_NATIVE_ROOT="$GITHUB_WORKSPACE/build/release" \
            bash scripts/run-phase5-production-accessibility.sh
          summary="$GITHUB_WORKSPACE/build/release/evidence/summary.txt"
          grep -Fxq 'production_atspi_gate=PASS' "$summary"
          grep -Fxq 'native_quit_process_exit=PASS' "$summary"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          root="$GITHUB_WORKSPACE/build/release"
          source="$root/Pikachu-Volleyball-Native-x86_64.AppImage"
          asset="$root/Pikachu-Volleyball-${package_version}-x86_64.AppImage"
          test -s "$source"
          cp "$source" "$asset"
          (
            cd "$root"
            sha256sum "$(basename "$asset")" > SHA256SUMS.txt
          )
          echo "PV_RELEASE_ASSET=$asset" >> "$GITHUB_ENV"
          echo "PV_RELEASE_CHECKSUMS=$root/SHA256SUMS.txt" >> "$GITHUB_ENV"

      - name: Upload release-candidate artifact
        uses: actions/upload-artifact@v6
        with:
          name: pikachu-volleyball-linux-x86_64
          path: |
            ${{ env.PV_RELEASE_ASSET }}
            ${{ env.PV_RELEASE_CHECKSUMS }}
            build/release/PikachuVolleyballNative.AppDir/provenance.json
            build/release/evidence/summary.txt
          if-no-files-found: error

      - name: Attach assets to authorized GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PV_RELEASE_ASSET }}
            ${{ env.PV_RELEASE_CHECKSUMS }}
