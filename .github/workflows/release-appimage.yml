name: Build Linux AppImage

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out definitive source
        uses: actions/checkout@v5
        with:
          ref: \${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          [[ "$package_version" == "$lock_version" ]] || {
            echo "package.json and package-lock.json versions differ." >&2
            exit 1
          }

          release_notes="docs/releases/v\${package_version}.md"
          [[ -f "$release_notes" ]] || {
            echo "Missing release notes: $release_notes" >&2
            exit 1
          }
          grep -Fq "$package_version" README.md || {
            echo "README does not mention release version $package_version" >&2
            exit 1
          }

          if [[ "\${{ github.event_name }}" == "release" ]]; then
            expected_tag="v\${package_version}"
            actual_tag="\${{ github.event.release.tag_name }}"
            [[ "$actual_tag" == "$expected_tag" ]] || {
              echo "Release tag $actual_tag does not match $expected_tag" >&2
              exit 1
            }
          fi

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Run repository quality checks
        run: npm run quality:check

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl xz-utils patchelf \
            binutils file libfuse2 xvfb x11-utils dbus-x11 at-spi2-core \
            python3-pyatspi libpng-dev libmpg123-dev libfreetype6-dev \
            libharfbuzz-dev libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Build native Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          root="$GITHUB_WORKSPACE/build/release"
          output="$root/Pikachu-Volleyball-\${package_version}-x86_64.AppImage"
          PV_NATIVE_RELEASE_ROOT="$root" \
          PV_NATIVE_APPIMAGE_OUTPUT="$output" \
            bash scripts/build-native-appimage.sh
          grep -Fxq 'direct_appimage_self_test=PASS' "$root/evidence/summary.txt"

      - name: Validate production accessibility through AT-SPI
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- env PV_PHASE5_NATIVE_ROOT="$GITHUB_WORKSPACE/build/release" \
            bash scripts/run-phase5-production-accessibility.sh

      - name: Verify candidate checksum
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/build/release"
          app="$(find "$root" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -s "$app"
          expected="$(sed -n 's/^sha256=//p' "$root/evidence/summary.txt" | head -1)"
          actual="$(sha256sum "$app" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
          (
            cd "$root"
            sha256sum "$(basename "$app")" > SHA256SUMS.txt
          )

      - name: Upload release-build artifact
        uses: actions/upload-artifact@v6
        with:
          name: pikachu-volleyball-linux-x86_64
          path: |
            build/release/*.AppImage
            build/release/SHA256SUMS.txt
            build/release/PikachuVolleyballNative.AppDir/provenance.json
            build/release/evidence/summary.txt
          if-no-files-found: error

      - name: Attach AppImage and checksum to authorized GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/*.AppImage
            build/release/SHA256SUMS.txt
