name: Pull Request Quality

on:
  pull_request:
    branches:
      - main
      - v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository quality checks
        run: npm run quality:check

      - name: Validate locale build outputs
        shell: bash
        run: |
          set -euo pipefail
          expected_files=(
            dist/en/index.html
            dist/en/update-history/index.html
            dist/es-ar/index.html
            dist/es-ar/update-history/index.html
            dist/ko/index.html
            dist/ko/update-history/index.html
            dist/zh/index.html
            dist/zh/update-history/index.html
          )

          for file in "${expected_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing expected locale output: $file" >&2
              exit 1
            fi
          done

  preview-appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run build:desktop:linux -- --publish=never

      - name: Verify AppImage artifact
        shell: bash
        run: |
          set -euo pipefail
          appimage_path="$(find release -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          test -n "$appimage_path"
          test -s "$appimage_path"
          sha256sum "$appimage_path" | tee release/SHA256SUMS.txt
          ls -lh "$appimage_path" release/SHA256SUMS.txt

      - name: Upload AppImage workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: pikachu-volleyball-operational-menu-appimage
          path: |
            release/*.AppImage
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
