name: Pull Request Quality

on:
  pull_request:
    branches:
      - main
      - v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Validate package versions
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"

          if [[ "$package_version" != "$lock_version" ]]; then
            echo "package.json version ($package_version) does not match package-lock.json ($lock_version)" >&2
            exit 1
          fi

          echo "Validated package version: $package_version"

      - name: Install dependencies
        run: npm ci

      - name: Run repository quality checks
        run: npm run quality:check

      - name: Validate locale build outputs
        shell: bash
        run: |
          set -euo pipefail
          expected_files=(
            dist/en/index.html
            dist/en/update-history/index.html
            dist/es-ar/index.html
            dist/es-ar/update-history/index.html
            dist/ca/index.html
            dist/ca/manifest.json
            dist/ca/update-history/index.html
            dist/ko/index.html
            dist/ko/update-history/index.html
            dist/zh/index.html
            dist/zh/update-history/index.html
            dist/resources/phase3-menu.css
          )

          for file in "${expected_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing expected locale output: $file" >&2
              exit 1
            fi
          done

          if ! grep -q 'lang="ca"' dist/ca/index.html; then
            echo "Catalan index output does not declare lang=ca" >&2
            exit 1
          fi

          for locale in en es-ar ca ko zh; do
            if ! grep -q '2.0.0' "dist/$locale/update-history/index.html"; then
              echo "Release history for $locale does not mention 2.0.0" >&2
              exit 1
            fi
          done

          if grep -q '2.0%20alpha' README.md; then
            echo "README still advertises an alpha release" >&2
            exit 1
          fi

  release-candidate-appimage:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run build:desktop:linux -- --publish=never

      - name: Verify release candidate and create checksum
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          mapfile -t appimages < <(find release -maxdepth 1 -type f -name '*.AppImage' | sort)

          if [[ "$package_version" != "2.0.0" ]]; then
            echo "Unexpected release-candidate version: $package_version" >&2
            exit 1
          fi

          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}" >&2
            exit 1
          fi

          appimage_path="${appimages[0]}"
          appimage_name="$(basename "$appimage_path")"
          expected_name="Pikachu-Volleyball-2.0.0-x86_64.AppImage"

          if [[ "$appimage_name" != "$expected_name" ]]; then
            echo "Unexpected AppImage name: $appimage_name" >&2
            exit 1
          fi

          if [[ ! -s "$appimage_path" ]]; then
            echo "AppImage is empty" >&2
            exit 1
          fi

          (
            cd release
            sha256sum "$appimage_name" > SHA256SUMS.txt
          )

          cat release/SHA256SUMS.txt
          ls -lh "$appimage_path" release/SHA256SUMS.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v6
        with:
          name: pikachu-volleyball-2.0.0-release-candidate
          path: |
            release/*.AppImage
            release/SHA256SUMS.txt
          if-no-files-found: error
