name: Pull Request Quality

on:
  pull_request:
    branches:
      - main
      - v2.1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pull-request-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
      - name: Validate package versions
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          [[ "$package_version" == "$lock_version" ]]
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Run repository quality checks
        run: npm run quality:check
      - name: Validate locale build outputs
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/en/index.html dist/en/update-history/index.html dist/es-ar/index.html dist/es-ar/update-history/index.html dist/ca/index.html dist/ca/manifest.json dist/ca/update-history/index.html dist/ko/index.html dist/ko/update-history/index.html dist/zh/index.html dist/zh/update-history/index.html dist/resources/integrated-menu.css; do
            [[ -f "$file" ]]
          done
          ! find dist -type f -name '*.map' -print -quit | grep -q .
          grep -q 'lang="ca"' dist/ca/index.html

  cleanup-phase2-diff:
    if: github.event_name == 'pull_request' && github.head_ref == 'v2.1-build-ui-consolidation' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'santirodriguez'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v5
        with:
          ref: v2.1-build-ui-consolidation
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reconstruct minimal diff
        run: node scripts/phase2-clean-diff.cjs
      - name: Validate reconstructed tree
        run: npm run quality:check
      - name: Remove temporary cleanup script
        run: rm scripts/phase2-clean-diff.cjs
      - name: Commit minimal product diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/pull-request-quality.yml'
          git diff --cached --check
          git commit -m "Reduce Phase 2 diff noise"
          git push origin HEAD:v2.1-build-ui-consolidation
