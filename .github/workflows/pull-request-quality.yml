name: Pull Request Quality

on:
  pull_request:
    branches:
      - main
      - v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository quality checks
        run: npm run quality:check

      - name: Validate locale build outputs
        shell: bash
        run: |
          set -euo pipefail
          expected_files=(
            dist/en/index.html
            dist/en/update-history/index.html
            dist/es-ar/index.html
            dist/es-ar/update-history/index.html
            dist/ca/index.html
            dist/ca/manifest.json
            dist/ca/update-history/index.html
            dist/ko/index.html
            dist/ko/update-history/index.html
            dist/zh/index.html
            dist/zh/update-history/index.html
            dist/resources/phase3-menu.css
          )

          for file in "${expected_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing expected locale output: $file" >&2
              exit 1
            fi
          done

          if ! grep -q 'lang="ca"' dist/ca/index.html; then
            echo "Catalan index output does not declare lang=ca" >&2
            exit 1
          fi

  preview-appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run build:appimage

      - name: Verify AppImage artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t appimages < <(find release -maxdepth 1 -type f -name '*.AppImage' -print)
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}" >&2
            exit 1
          fi

          size=$(stat -c%s "${appimages[0]}")
          if [[ $size -lt 1000000 ]]; then
            echo "AppImage is unexpectedly small: $size bytes" >&2
            exit 1
          fi

          sha256sum "${appimages[0]}" > release/SHA256SUMS.txt
          ls -lh "${appimages[0]}" release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Upload AppImage workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pikachu-volleyball-controls-catalan-appimage
          path: |
            release/*.AppImage
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
