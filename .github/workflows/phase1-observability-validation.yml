name: Phase 1 Observability Validation

on:
  pull_request:
    branches:
      - v2.1

permissions:
  contents: read

concurrency:
  group: phase1-observability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Check observability script syntax
        run: |
          node --check desktop/main.js
          node --check scripts/measure-startup.cjs
          node --check scripts/report-build-metrics.cjs

      - name: Run repository quality checks
        run: npm run quality:check

      - name: Build Linux AppImage
        run: npm run build:desktop:linux -- --publish=never

      - name: Inspect packaged application
        shell: bash
        run: |
          set -euo pipefail
          app_dir="release/linux-unpacked"
          asar_path="$app_dir/resources/app.asar"
          mapfile -t locale_paks < <(find "$app_dir/locales" -maxdepth 1 -type f -name '*.pak' | sort)
          if [[ "${#locale_paks[@]}" -ne 1 || "$(basename "${locale_paks[0]}")" != "en-US.pak" ]]; then
            echo "Expected only Electron locale en-US.pak" >&2
            exit 1
          fi
          npx --no-install asar list "$asar_path" > /tmp/asar-listing.txt
          if grep -q '^/node_modules/' /tmp/asar-listing.txt; then
            echo "Packaged app still contains runtime node_modules" >&2
            exit 1
          fi
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "Production build contains source maps" >&2
            exit 1
          fi

      - name: Report build sizes
        run: node scripts/report-build-metrics.cjs release/build-metrics.json

      - name: Measure packaged startup
        run: xvfb-run -a node scripts/measure-startup.cjs release/startup-metrics.json

      - name: Upload validation evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase1-observability-validation
          path: |
            release/*.AppImage
            release/build-metrics.json
            release/startup-metrics.json
          if-no-files-found: error
