name: Temporary Lockfile Refresh

on:
  pull_request:
    branches:
      - v2.1

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.head_ref == 'v2.1-appimage-footprint' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'santirodriguez'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: v2.1-appimage-footprint
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Regenerate package metadata
        run: npm install --save-dev --save-exact electron-builder@26.15.7 --package-lock-only --ignore-scripts

      - name: Verify resolved toolchain
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if (p.devDependencies['electron-builder'] !== '26.15.7') process.exit(1)"
          node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/electron-builder']; if (!p || p.version !== '26.15.7') process.exit(1)"
          node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/app-builder-lib']; if (!p || !/^26\.15\./.test(p.version)) process.exit(1)"

      - name: Restore workflow files and commit package metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v2.1 --depth=1
          git show origin/v2.1:.github/workflows/pull-request-quality.yml > .github/workflows/pull-request-quality.yml
          git rm .github/workflows/tmp-lockfile-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/pull-request-quality.yml
          git commit -m "Update electron-builder packaging toolchain"
          git push origin HEAD:v2.1-appimage-footprint
