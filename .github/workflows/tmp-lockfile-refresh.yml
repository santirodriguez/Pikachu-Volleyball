name: Temporary Lockfile Refresh

on:
  pull_request:
    branches:
      - v2.1

permissions:
  contents: read

jobs:
  refresh-lockfile:
    if: github.head_ref == 'v2.1-appimage-footprint'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Regenerate package metadata
        run: npm install --save-dev --save-exact electron-builder@26.15.7 --package-lock-only --ignore-scripts

      - name: Verify resolved toolchain
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if (p.devDependencies['electron-builder'] !== '26.15.7') process.exit(1)"
          node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/electron-builder']; if (!p || p.version !== '26.15.7') process.exit(1)"
          node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/app-builder-lib']; if (!p || !/^26\.15\./.test(p.version)) process.exit(1)"

      - name: Upload refreshed package metadata
        uses: actions/upload-artifact@v6
        with:
          name: refreshed-package-metadata
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
